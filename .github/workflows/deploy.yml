name: terraform-demo

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "policies/**"
  workflow_dispatch:

permissions:
  contents: read

# State is local to the runner, so never run two applies at the same time.
concurrency:
  group: terraform-demo
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1

jobs:
  # TEMPORARY: manual-run-only diagnostics for the OIDC AccessDenied. Remove after fixing.
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check secret shape (does not print the value)
        env:
          ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          echo "length=${#ID}"
          if [[ "$ID" =~ ^[0-9]{12}$ ]]; then echo "format=ok"; else echo "format=NG"; fi
      - name: Show OIDC token claims (iss / aud / sub only)
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print({k: claims.get(k) for k in ("iss", "aud", "sub")})
          PY

  # Job 0: did this push touch policies/ ?
  detect:
    runs-on: ubuntu-latest
    outputs:
      policies_changed: ${{ steps.diff.outputs.policies_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^policies/'; then
            echo "policies_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "policies_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Job 1: attach policies/deploy-role.json to the deploy role.
  # Runs only when policies/ changed, and waits for approval on the iam-admin Environment.
  grant-permissions:
    needs: detect
    if: needs.detect.outputs.policies_changed == 'true'
    runs-on: ubuntu-latest
    environment: iam-admin
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/apdemo-github-iam-admin
          aws-region: ${{ env.AWS_REGION }}
      - name: Put inline policy on the deploy role
        run: |
          aws iam put-role-policy \
            --role-name apdemo-github-deploy \
            --policy-name autopilot-generated \
            --policy-document file://policies/deploy-role.json

  # Job 2: terraform apply -> destroy with the deploy role.
  # Runs after job 1 succeeded, or when job 1 was skipped (policies/ unchanged).
  deploy:
    needs: [detect, grant-permissions]
    if: >-
      ${{ !cancelled()
      && needs.detect.result == 'success'
      && (needs.grant-permissions.result == 'success' || needs.grant-permissions.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/apdemo-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - id: init
        run: terraform init
      - id: apply
        run: terraform apply -auto-approve
      - name: Destroy (only if init succeeded)
        if: ${{ always() && steps.init.conclusion == 'success' }}
        run: terraform destroy -auto-approve